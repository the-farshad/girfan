[package]
name = "girfan"
version = "0.1.0"
edition = "2024"
description = "Bank accounts, cards and spending on your own computer, through Plaid"
license-file = "LICENSE"

[dependencies]
aes-gcm = "0.11.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
regex = "1.13.1"
rpassword = "7.5.5"
rusqlite = { version = "0.42.0", features = ["bundled", "serialize"] }
scrypt = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"
ureq = { version = "3.5.2", features = ["json"] }
